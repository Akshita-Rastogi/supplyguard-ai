services:
  api:
    build: .
    env_file: [.env]
    ports: ["8000:8000"]
    depends_on:
      mongo:
        condition: service_healthy
      qdrant:
        condition: service_started
      mcp-tools:
        condition: service_started
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - "./evaluation.json:/app/evaluation.json:ro"
      - "./output/evaluation:/app/output/evaluation"
    security_opt: ["no-new-privileges:true"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  mongo:
    # MongoDB builds after 8.0.4 refuse Docker Desktop kernels in the affected
    # Linux 6.19–7.0.13 range (SERVER-121912). Keep the same 8.0 data format
    # while using the compatible local-demo patch until Docker's kernel is fixed.
    image: mongo:8.0.4
    environment:
      MONGO_INITDB_ROOT_USERNAME: supplyguard
      MONGO_INITDB_ROOT_PASSWORD: supplyguard
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    command: ["mongod", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 20
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 3s
      retries: 20
  mcp-tools:
    build: .
    command: ["python", "-m", "supplyguard.mcp_server"]
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      DATA_PATH: /app/data/raw/public/fema_disaster_declarations_full.csv
    ports: ["8001:8001"]
    read_only: true
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      disable: true
  ui:
    build: .
    command: ["streamlit", "run", "ui/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    environment:
      API_BASE_URL: http://api:8000
      API_KEY: demo-key
    ports: ["8501:8501"]
    depends_on: [api]
    volumes: ["./ui:/app/ui:ro", "./evaluation.json:/app/evaluation.json:ro"]
    healthcheck:
      disable: true
volumes:
  mongo_data:
  qdrant_data:
